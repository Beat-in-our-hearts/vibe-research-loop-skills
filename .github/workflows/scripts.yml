name: scripts

on:
  push:
    paths:
      - "skills/vrl-init-workspace/scripts/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "skills/vrl-init-workspace/scripts/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning -s bash skills/vrl-init-workspace/scripts/*.sh
