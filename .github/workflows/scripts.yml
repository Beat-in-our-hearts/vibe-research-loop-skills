name: scripts

on:
  push:
    paths:
      - "skills/vrl-init-workspace/scripts/**"
      - "tests/scripts/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "skills/vrl-init-workspace/scripts/**"
      - "tests/scripts/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux and shellcheck
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tmux shellcheck
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq tmux shellcheck
          fi
      - name: Shellcheck
        run: shellcheck -S warning -s bash skills/vrl-init-workspace/scripts/*.sh tests/scripts/*.sh tests/scripts/fakes/*
      - name: Tests
        run: bash tests/scripts/run.sh
